<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsalan Mirsadraei — Architect</title>
<meta name="description" content="Arsalan Mirsadraei, architect in Las Vegas. Construction documents and design development on hospitality and civic projects at Klai Juba Wald, design studio teaching at UNLV, and research on tall-building evacuation.">
<meta property="og:title" content="Arsalan Mirsadraei — Architect">
<meta property="og:description" content="Architect, researcher and educator in Las Vegas.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Cpath d='M7 24 L13.5 8 L20 24 M9.6 18h7.8 M20 24 V8 l3.5 9 3.5-9 v16' stroke='%23F6F4F0' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem('am-theme');}catch(e){}if(t!=='dark'&&t!=='light')t='light';var d=document.documentElement;d.setAttribute('data-theme',t);d.classList.add('js');})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F4F0;--fg:#111111;--mute:rgba(17,17,17,.64);--faint:rgba(17,17,17,.46);
  --line:rgba(17,17,17,.14);--fill:rgba(17,17,17,.045);--amber:#B8731F;--sage:#4A7A58;--paper:#F6F4F0;
  --sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --hdr:56px;--pad:clamp(20px,4vw,48px);--max:1440px;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0E0E0E;--fg:#ECEAE6;--mute:rgba(236,234,230,.66);--faint:rgba(236,234,230,.46);
  --line:rgba(236,234,230,.15);--fill:rgba(236,234,230,.05);--amber:#D08A35;--sage:#7DAD8C;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.6;background:var(--bg);color:var(--fg);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;display:flex;flex-direction:column}
html.theme-swap *,html.theme-swap *::before,html.theme-swap *::after{transition:none!important}
img,video{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
::selection{background:var(--amber);color:var(--bg)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--fg);color:var(--bg);padding:10px 14px;text-decoration:none;font-size:14px}
.skip:focus{top:12px}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:0}
.mute{color:var(--mute)}

/* ── header ── */
.hdr{position:fixed;inset:0 0 auto 0;height:var(--hdr);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease);view-transition-name:hdr}
.hdr.ruled{border-bottom-color:var(--line)}
.hdr.over{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:#F4F2EE;border-bottom-color:transparent}
.hdr .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap;letter-spacing:-.005em}
.nav{display:flex;align-items:center;gap:clamp(14px,2.2vw,30px)}
.nav a{font-size:15px;text-decoration:none;position:relative;padding:6px 0;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav a[aria-current=page]::after{transform:scaleX(1)}
@media (hover:hover) and (pointer:fine){.nav a:hover::after{transform:scaleX(1)}}
.tog{width:32px;height:32px;display:grid;place-items:center;margin-left:4px;margin-right:-6px}
.tog svg{width:16px;height:16px}
.tog .moon{display:none}html[data-theme=dark] .tog .sun{display:none}html[data-theme=dark] .tog .moon{display:block}
.menu-b{display:none;font-size:15px;padding:6px 0}
@media (max-width:760px){
  .menu-b{display:block}
  .nav{position:fixed;inset:var(--hdr) 0 auto 0;flex-direction:column;align-items:flex-start;gap:0;background:var(--bg);color:var(--fg);padding:8px var(--pad) 24px;border-bottom:1px solid var(--line);transform:translateY(-8px);opacity:0;visibility:hidden;transition:opacity .2s var(--ease),transform .2s var(--ease),visibility 0s .2s}
  .nav.open{opacity:1;transform:none;visibility:visible;transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .nav a{font-size:22px;padding:10px 0;width:100%;border-bottom:1px solid var(--line)}
  .nav a::after{display:none}
  .nav a[aria-current=page]{color:var(--amber)}
  .tog{margin:14px 0 0 -6px}
}

/* ── view container ── */
main{flex:1;padding-top:var(--hdr);view-transition-name:main}
main.flush{padding-top:0}
.view{animation:none}
main .view.enter{animation:vin .32s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::view-transition-old(main){animation:vout .16s var(--ease) both}
::view-transition-new(main){animation:vin .32s var(--ease) .04s both}
@keyframes vout{to{opacity:0}}

/* ── type ── */
.display{font-size:clamp(44px,7.2vw,112px);line-height:.98;font-weight:500;letter-spacing:-.035em}
.h1{font-size:clamp(36px,5vw,72px);line-height:1.02;font-weight:500;letter-spacing:-.03em}
.h2{font-size:clamp(26px,2.8vw,40px);line-height:1.12;font-weight:500;letter-spacing:-.02em}
.h3{font-size:20px;line-height:1.3;font-weight:500;letter-spacing:-.01em}
.lede{font-size:clamp(19px,1.7vw,24px);line-height:1.42;letter-spacing:-.01em;max-width:34ch}
.lede.wide{max-width:46ch}
.prose{max-width:64ch}
.prose p+p{margin-top:1em}
.prose p{color:var(--fg)}
.kick{font-family:var(--mono);font-size:13px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.lnk{text-decoration:underline;text-decoration-color:var(--line);transition:text-decoration-color .15s,color .15s}
@media (hover:hover){.lnk:hover{text-decoration-color:currentColor;color:var(--amber)}}
.arrow{display:inline-block;transition:transform .2s var(--ease)}
@media (hover:hover){a:hover .arrow{transform:translateX(3px)}}

/* ── sections / grid ── */
.sec{padding:clamp(64px,9vw,128px) 0}
.sec+.sec{border-top:1px solid var(--line)}
.sec.tight+.sec.tight{border-top:0;padding-top:0}
.sec.tight{padding:clamp(48px,6vw,80px) 0}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.c-l{grid-column:1/span 4}.c-r{grid-column:5/span 8}.c-r7{grid-column:6/span 7}
@media (max-width:900px){.g12{grid-template-columns:1fr}.c-l,.c-r,.c-r7{grid-column:auto}.c-l{margin-bottom:24px}}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-bottom:clamp(28px,4vw,48px);flex-wrap:wrap}

/* ── hero (home) ── */
.hero{position:relative;height:100svh;min-height:560px;background:#1a1a1a;color:#F4F2EE;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(0,0,0,.62) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(28px,5vw,56px)}
.hero h1{margin-bottom:22px}
.hero .lede{color:rgba(244,242,238,.9);max-width:40ch}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero .kick{color:rgba(244,242,238,.78);margin-bottom:18px}
.vid-b{font-family:var(--mono);font-size:12px;color:rgba(244,242,238,.8);border:1px solid rgba(244,242,238,.35);padding:7px 12px;transition:background .15s,color .15s}
@media (hover:hover){.vid-b:hover{background:#F4F2EE;color:#111}}
.hero-in>*{opacity:0;transform:translateY(14px);animation:hin .7s var(--ease) forwards}
.hero-in>*:nth-child(2){animation-delay:.08s}.hero-in>*:nth-child(3){animation-delay:.16s}.hero-in>*:nth-child(4){animation-delay:.24s}
@keyframes hin{to{opacity:1;transform:none}}

/* ── index list ── */
.idx{border-top:1px solid var(--fg)}
.idx-h,.row{display:grid;grid-template-columns:56px minmax(0,5fr) minmax(0,2fr) minmax(0,3fr) 64px;gap:16px;align-items:baseline}
.idx-h{font-family:var(--mono);font-size:12px;color:var(--mute);padding:10px 0;border-bottom:1px solid var(--line)}
.row{padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;position:relative;transition:color .15s}
.row .n,.row .y,.row .t,.row .l{font-family:var(--mono);font-size:13px;color:var(--mute)}
.row .y{text-align:right}.idx-h span:last-child{text-align:right}
.row .ti{font-size:clamp(18px,1.6vw,22px);letter-spacing:-.01em;line-height:1.3}
.row .ti small{display:block;font-size:14px;color:var(--mute);letter-spacing:0;margin-top:2px}
@media (hover:hover){.row:hover .ti{color:var(--amber)}.idx:hover .row:not(:hover){color:var(--faint)}}
@media (max-width:760px){
  .idx-h{display:none}
  .row{grid-template-columns:40px 1fr auto;row-gap:2px}
  .row .t,.row .l{grid-column:2}
  .row .y{grid-column:3;grid-row:1}
}
.peek{position:fixed;left:0;top:0;width:340px;pointer-events:none;z-index:40;opacity:0;transform:translate3d(0,0,0);transition:opacity .18s var(--ease)}
.peek.on{opacity:1}
.peek img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--fill)}
.peek-card{display:none;aspect-ratio:4/3;background:var(--bg);border:1px solid var(--line);box-shadow:0 1px 0 var(--line);padding:20px;flex-direction:column;justify-content:flex-end;gap:8px}
.peek-card span{font-size:22px;line-height:1.2;letter-spacing:-.015em;max-width:16ch}
.peek-card small{font-family:var(--mono);font-size:12px;color:var(--mute)}
.peek.card img{display:none}.peek.card .peek-card{display:flex}
@media not ((hover:hover) and (pointer:fine)){.peek{display:none}}

/* ── work grid ── */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;padding:6px 12px;border:1px solid var(--line);transition:border-color .15s,background .15s,color .15s}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (hover:hover){.chip:not([aria-pressed=true]):hover{border-color:var(--fg)}}
.vtog{display:flex;gap:16px;font-size:14px}
.vtog button{color:var(--mute);padding:6px 0}
.vtog button[aria-pressed=true]{color:var(--fg);text-decoration:underline;text-underline-offset:.3em}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{text-decoration:none;display:block}
.card .im{aspect-ratio:4/3;overflow:hidden;background:var(--fill);margin-bottom:14px}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
@media (hover:hover){.card:hover .im img{transform:scale(1.025)}.card:hover .ti{color:var(--amber)}}
.card .ti{font-size:18px;line-height:1.3;letter-spacing:-.01em;transition:color .15s}
.card .mt{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between;gap:12px}
.group-h{display:flex;align-items:baseline;gap:16px;margin:clamp(56px,7vw,96px) 0 24px;padding-top:16px;border-top:1px solid var(--fg)}
section:first-of-type>.group-h{margin-top:0}
.group-h p{color:var(--mute);font-size:15px;max-width:60ch}

/* ── project page ── */
.p-top{padding-top:clamp(40px,6vw,88px);padding-bottom:clamp(28px,4vw,48px)}
.crumb{font-size:14px;color:var(--mute);text-decoration:none;display:inline-flex;gap:8px;margin-bottom:clamp(28px,4vw,56px)}
@media (hover:hover){.crumb:hover{color:var(--fg)}}
.p-top .kick{margin-bottom:18px}
.p-top .lede{margin-top:22px}
.p-hero{margin:0 auto;max-width:var(--max);padding:0 var(--pad)}
.p-hero img{width:100%;max-height:86vh;object-fit:cover;background:var(--fill)}
.credit{font-family:var(--mono);font-size:12px;color:var(--mute);margin-top:10px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.facts{border-top:1px solid var(--fg)}
.facts div{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.facts dt{color:var(--mute)}
.p-body{padding:clamp(48px,6vw,88px) 0}
.p-links{margin-top:44px}
.p-links .h3{margin-bottom:12px}
.rd-list{border-top:1px solid var(--fg)}
.rd{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr) auto;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:baseline}
.rd-s{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.rd-t{font-size:15px;line-height:1.4;transition:color .15s}
.rd-d{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap}
@media (hover:hover){.rd:hover .rd-t{color:var(--amber)}}
@media (max-width:560px){.rd{grid-template-columns:1fr auto}.rd-t{grid-column:1/-1;grid-row:2}}
.hero-link{display:block;position:relative;overflow:hidden;text-decoration:none;color:inherit}
.hero-link img{transition:transform .8s var(--ease)}
.hero-go{position:absolute;right:16px;bottom:16px;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12.5px;padding:8px 12px;opacity:0;transform:translateY(6px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
@media (hover:hover){.hero-link:hover img{transform:scale(1.015)}.hero-link:hover .hero-go,.hero-link:focus-visible .hero-go{opacity:1;transform:none}}
@media not (hover:hover){.hero-go{opacity:1;transform:none}}
.credit a{white-space:nowrap}
.fig-wrap{padding:clamp(40px,5vw,72px) 0;border-top:1px solid var(--line)}
.fig-wrap .fig-h{display:flex;justify-content:space-between;gap:24px;align-items:baseline;margin-bottom:28px;flex-wrap:wrap}
.fig-wrap .fig-h p{color:var(--mute);font-size:15px;max-width:52ch}
.fig{max-width:1100px;margin:0}
.fig-wrap .fig-h{max-width:1100px}
.gal{display:flex;flex-direction:column;gap:clamp(48px,6vw,96px);padding:clamp(40px,5vw,80px) 0;border-top:1px solid var(--line)}
.gi{margin:0 auto;width:100%}
.gi img{margin:0 auto;max-height:88vh;width:auto;max-width:100%;background:var(--fill)}
.gi.land{max-width:1280px}.gi.port{max-width:760px}.gi.draw{max-width:1100px}
.gi figcaption{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin-top:12px;display:flex;gap:14px}
.gi figcaption b{font-weight:400;color:var(--faint)}
html[data-theme=dark] .gi.draw img{filter:brightness(.92)}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--fg)}
.pn a{padding:28px 0 36px;text-decoration:none;display:block}
.pn a+a{text-align:right;border-left:1px solid var(--line);padding-left:24px}
.pn small{display:block;font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:8px}
.pn span{font-size:clamp(18px,2vw,26px);letter-spacing:-.015em;line-height:1.25;transition:color .15s}
@media (hover:hover){.pn a:hover span{color:var(--amber)}}
.note{font-size:14px;color:var(--mute);border-left:2px solid var(--amber);padding:2px 0 2px 14px;margin-top:24px;max-width:60ch}

/* ── spreads viewer (archive) ── */
.spreads{display:flex;flex-direction:column;gap:32px;padding:clamp(32px,4vw,64px) 0}
.spread{display:flex;justify-content:center;gap:2px;background:var(--fill);padding:clamp(12px,2vw,28px);text-decoration:none}
.spread img{width:calc(50% - 1px);height:auto}
.spread.one img{width:50%}

.ph{width:100%;height:100%;min-height:220px;aspect-ratio:4/3;background:var(--fill);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:20px;border:1px solid var(--line)}
.p-hero .ph{aspect-ratio:16/7;min-height:280px}
.ph span{font-size:clamp(18px,2vw,26px);letter-spacing:-.015em;line-height:1.2;max-width:22ch}
.ph small{font-family:var(--mono);font-size:12px;color:var(--mute)}
.card .im .ph{border:0;aspect-ratio:auto}
/* ── about / cv ── */
.rows>div,.rows>li{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,6fr) minmax(0,3fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--line);list-style:none}
.rows{border-top:1px solid var(--fg)}
.rows .a{font-family:var(--mono);font-size:13px;color:var(--mute);padding-top:2px}
.rows .b strong{display:block;font-weight:500;font-size:17px;letter-spacing:-.005em}
.rows .b span{display:block;color:var(--mute);font-size:15px;margin-top:2px}
.rows .b span.arrow{display:inline-block;color:inherit;font-size:inherit;margin:0}
.rows .b p{font-size:15px;color:var(--mute);margin-top:8px;max-width:58ch}
.rows .c{font-size:14px;color:var(--mute);text-align:right}
@media (max-width:760px){.rows>div,.rows>li{grid-template-columns:1fr;gap:4px}.rows .c{text-align:left}}
.cert-img{margin-top:40px;max-width:820px}
.cert-img img{border:1px solid var(--line)}
.tools{font-size:15px}
.tools div{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding:14px 0;border-bottom:1px solid var(--line)}
.tools dt{color:var(--mute)}
@media (max-width:760px){.tools div{grid-template-columns:1fr;gap:2px}}

/* ── teaching ── */
.coh{padding:clamp(48px,6vw,88px) 0;border-top:1px solid var(--line)}
.coh-h{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;margin-bottom:clamp(32px,4vw,56px)}
@media (max-width:900px){.coh-h{grid-template-columns:1fr}}
.coh-logo{height:40px;width:auto;margin-bottom:20px}
html[data-theme=dark] .coh-logo.l{display:none}html:not([data-theme=dark]) .coh-logo.d{display:none}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 24px}
@media (max-width:760px){.sw{grid-template-columns:1fr}}
.sw-c{display:block;text-align:left;width:100%}
.sw-c .im{aspect-ratio:4/3;background:var(--fill);overflow:hidden;margin-bottom:16px;position:relative}
.sw-c .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.sw-c .im.board img{object-fit:contain;padding:12px}
.sw-c .ti{font-size:20px;letter-spacing:-.01em;transition:color .15s}
.sw-c .by{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin:4px 0 10px}
.sw-c p{font-size:15px;color:var(--mute);max-width:56ch}
.sw-c .open{font-size:14px;margin-top:12px;display:inline-block;text-decoration:underline;text-underline-offset:.22em;text-decoration-color:var(--line)}
@media (hover:hover){.sw-c:hover .ti{color:var(--amber)}.sw-c:hover .im img{transform:scale(1.02)}}

/* ── video items ── */
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 24px}
@media (max-width:900px){.vids{grid-template-columns:1fr}}
.vids video{width:100%;background:#000;aspect-ratio:16/9}
.vids h3{margin-top:16px}
.vids p{color:var(--mute);font-size:15px;margin-top:6px;max-width:56ch}

/* ── contact ── */
.big-l{font-size:clamp(24px,3.4vw,48px);letter-spacing:-.025em;line-height:1.15;text-decoration:none;display:inline-block;border-bottom:1px solid var(--line);transition:border-color .2s,color .2s;word-break:break-word}
@media (hover:hover){.big-l:hover{border-color:currentColor;color:var(--amber)}}

/* ── footer ── */
.ftr{border-top:1px solid var(--line);padding:28px 0 36px;font-size:14px;color:var(--mute)}
.ftr .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ftr a{text-decoration:none}
@media (hover:hover){.ftr a:hover{color:var(--fg)}}
.ftr nav{display:flex;gap:20px;flex-wrap:wrap}

/* ── lightbox ── */
dialog.lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;border:0;background:var(--bg);color:var(--fg);padding:0;display:none}
dialog.lb[open]{display:flex;flex-direction:column;animation:vin .25s var(--ease)}
dialog.lb::backdrop{background:var(--bg)}
.lb-top{height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--pad);border-bottom:1px solid var(--line);flex-shrink:0}
.lb-top .ttl{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-top .ttl span{color:var(--mute);margin-left:10px;font-family:var(--mono);font-size:12.5px}
.lb-top .acts{display:flex;gap:20px;font-size:14px;flex-shrink:0}
.lb-body{flex:1;min-height:0;display:flex;align-items:stretch}
.lb-stage{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px var(--pad)}
.lb-stage.fit{justify-content:center;overflow:hidden}
.lb-stage.fit .pair{display:flex;gap:2px;max-height:100%;max-width:100%;justify-content:center}
.lb-stage.fit img{max-height:calc(100vh - var(--hdr) - 48px - 56px);width:auto;max-width:50%;object-fit:contain}
.lb-stage.fit .pair.one img{max-width:100%}
.lb-stage canvas{max-width:100%;height:auto;background:#fff}
.lb-arr{width:56px;flex-shrink:0;font-size:22px;color:var(--mute);transition:color .15s}
@media (hover:hover){.lb-arr:hover{color:var(--fg)}}
.lb-foot{border-top:1px solid var(--line);padding:14px var(--pad);font-size:14px;color:var(--mute);min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.lb-load{font-family:var(--mono);font-size:13px;color:var(--mute);margin:auto}
@media (max-width:760px){.lb-arr{width:40px}}

/* ── reveal ── */
html.js .rv{opacity:0;transform:translateY(12px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
html.js .rv.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  html.js .rv{opacity:1;transform:none}
  .hero-in>*{opacity:1;transform:none}
  ::view-transition-old(main),::view-transition-new(main){animation:none}
}
@media print{.hdr,.ftr,.peek,.vid-b,.fig button{display:none!important}main{padding-top:0}.hero{height:auto;min-height:0;color:#111;background:none}.hero video,.hero::after{display:none}.hero .lede,.hero .kick{color:#111}html.js .rv{opacity:1;transform:none}}

</style>

as sets opening date", "date": "Aug 2023", "url": "https://www.reviewjournal.com/business/casinos-gaming/new-station-casinos-property-in-las-vegas-sets-opening-date-2881973"}, {"src": "JIVE Architecture", "label": "Durango Casino & Resort, project page", "date": "", "url": "https://jivelv.com/portfolio/durango-casino-resort/"}, {"src": "KTNV Las Vegas", "label": "Durango Casino and Resort hosts ribbon cutting and fireworks for grand opening", "date": "", "url": "https://ktnv.com/news/durango-casino-and-resort-hosts-ribbon-cutting-ceremony-fireworks-for-grand-opening"}], "year": "2023", "credit": "Image: JIVE Architecture", "group": "practice", "city": "Las Vegas", "phase": "Façade and drawing sets", "creditNote": "I worked on this project as part of the team at JIVE Architecture. The design is the firm's, and the image above is the owner's or the firm's, not my rendering.", "primary": {"src": "Las Vegas Review-Journal", "label": "New Station Casinos property in Las Vegas sets opening date", "date": "Aug 2023", "url": "https://www.reviewjournal.com/business/casinos-gaming/new-station-casinos-property-in-las-vegas-sets-opening-date-2881973"}, "thumb": "https://jivelv.com/wp-content/uploads/2026/06/Durango-Exterior-1.webp"}, {"slug": "house-for-books", "title": "A House for Books, Music and Trees", "kind": "Thesis", "programme": "Library and concert hall", "location": "Rzeszów, Poland", "year": "2024", "season": "Spring 2024", "institution": "University of Nevada, Las Vegas", "supervisor": "Dr. Steffen Lehmann", "role": "Research on combining a concert hall and a library, keeping the valuable old trees, design and visualization", "summary": "A library and concert hall for Rzeszów, set in a garden landscape around a glass-roofed atrium that keeps the site’s old willow trees.", "body": ["Rzeszów is a walkable city with a dense historical center, yet its residents still rely heavily on private cars, often seen as status symbols. The proposed New Library aims to serve diverse age groups, including teenagers, a group often overlooked in favor of the aging population and families with children. Designed as a world-class cultural institution that combines a library and a concert hall, the project emphasizes a grand entrance sequence and a clear functional organization, and aims to offer a serious, non-commercial cultural experience.", "The project consists of two three-story building parts that are interconnected and form a large ‘Forum’ and a Garden Atrium with a glass roof. The library’s separate volumes intersect around this atrium courtyard with its willow trees, which lets light reach the ground floor. The concert hall sits on the ground floor, separate from the library on the upper floors, and both are set away from the busy main road, in the garden landscape. A bridge at level +3 links the building parts, and elevator cores and staircases along the edge of the courtyard keep circulation simple.", "The building is split into six distinct yet interconnected parts: the Library with its reading rooms, the Public Forum Entrance Hall, the Concert Hall, the Conference Centre, the Exhibition Room and the landscaped Garden Atrium. The library is a public square surrounded by books, a Forum where people come together and talk. The 500 m² flexible exhibition hall on the ground floor can hold permanent and travelling exhibitions as well as social events.", "The library floors are built in prefabricated mass timber, cross-laminated timber panels and glulam beams, on a concrete ground-floor podium that contains the concert hall. This reduces the embodied carbon of the materials and the weight of the building, which means smaller foundations and faster construction; the Polish building code permits timber structures up to four stories. The roof terrace with a panorama deck on level +4, partly green roof and partly granite slabs with wooden benches, looks into the library through large skylights."], "facts": [["Building parts", "Two, three stories, interconnected"], ["Exhibition hall", "500 m², ground floor"], ["Bridge", "Level +3"], ["Roof terrace", "Level +4, above the library"], ["Structure", "Concrete ground-floor podium; prefabricated mass timber above (CLT panels, glulam beams)"]], "hero": {"src": "assets/work/house-for-books/hero.jpg", "alt": "Exterior render of the library and concert hall entrance, a cantilevered volume with a large printed panel above the glazed lobby", "w": 1412, "h": 901}, "gallery": [{"src": "assets/work/house-for-books/01.jpg", "alt": "Two orange street maps of Rzeszów, the second zoomed in on the site", "caption": "Project location in Rzeszów, city and enlarged site", "w": 1429, "h": 618, "kind": "draw"}, {"src": "assets/work/house-for-books/02.jpg", "alt": "Black-and-white axonometric of the building among neighbouring blocks, showing the glass-roofed atrium", "caption": "Axonometric view in context", "w": 1445, "h": 834, "kind": "draw"}, {"src": "assets/work/house-for-books/03.jpg", "alt": "Colour-coded longitudinal section through the library and concert hall, with a legend of spaces", "caption": "Longitudinal section with programme legend", "w": 1438, "h": 810, "kind": "draw"}, {"src": "assets/work/house-for-books/04.jpg", "alt": "Cutaway axonometric of the ground floor with the concert hall, the tree-planted atrium courtyard and service rooms", "caption": "Ground-floor axonometric", "w": 1382, "h": 850, "kind": "draw"}, {"src": "assets/work/house-for-books/05.jpg", "alt": "Cutaway axonometric of the upper floor with the library reading rooms", "caption": "Library-level axonometric", "w": 1396, "h": 625, "kind": "draw"}, {"src": "assets/work/house-for-books/06.jpg", "alt": "Colour-coded cross-section showing the concert hall below the library and a willow tree in the atrium", "caption": "Cross-section through the atrium with programme legend", "w": 1454, "h": 767, "kind": "draw"}, {"src": "assets/work/house-for-books/07.jpg", "alt": "Render of a bright interior with wide stepped seating under a high ceiling", "caption": "Interior with stepped seating", "w": 909, "h": 582, "kind": "land"}, {"src": "assets/work/house-for-books/08.jpg", "alt": "Render of the glass-roofed Garden Atrium with willow trees and a stair rising to the upper floors", "caption": "Garden Atrium", "w": 986, "h": 602, "kind": "land"}], "links": [{"label": "“Rebels building the future”", "url": "https://unlvscarletandgray.com/news/rebels-building-the-future/", "src": "UNLV Scarlet and Gray", "date": ""}], "pdf_pages": "26–31", "group": "design", "city": "Rzeszów"}, {"slug": "highway-14-tower", "title": "Legendary Highway 14 Tower", "kind": "Competition", "programme": "Observation tower and community platform", "location": "De Smet, South Dakota", "year": "2023", "season": "Summer 2023", "supervisor": "William Hallisky", "role": "Design and visualization", "summary": "An observation tower for De Smet with a fiber-optic concrete shell, an interior ramp through the town’s history and a platform for daily markets.", "body": ["The strong sense of pride and community connection in Big Slough and Silver Lake, together with the history of the pioneers who settled De Smet, led to a project for both tourists and local people. The goal is a lasting community space for every part of De Smet’s population that also attracts visitors: a hub for exploring the town’s history, present and future, where people can trade their daily products or meditate with the sound and view of the birds on the horizon.", "Parts of the natural landscape are preserved, so residents can keep using the land as they always have, and a flat platform on the observation tower allows events such as daily farmers’ markets. The tower’s wide opening draws on the glacier that covered the area about 10,000 years ago and shaped the landscape. Its fiber-optic concrete shell resembles the night sky, and floors of locally sourced wood support sustainability and a stronger sense of community attachment.", "The railroad that brought Charles P. Ingalls to the area, as timekeeper for the rail construction crew, played an important part in founding De Smet, and Ingalls became the town’s first resident. The railroad as a journey through time becomes an interior ramp, the starting point for exploring De Smet’s history, present and future. Along it, pause spaces offer a cup of coffee with framed views of the landscape or a quiet, Zen-like retreat.", "Two hydropower generators sit in the central void and a wind turbine on top of the building. Children can play underneath the generators and see the details of the turbine safely, which ties them more closely to the building and the community."], "facts": [["Shell", "Fiber-optic concrete"], ["Floors", "Locally sourced wood"], ["Levels shown", "Ground floor and levels 1–6"], ["Energy", "Two hydropower generators in the central void; wind turbine on top"]], "hero": {"src": "assets/work/highway-14-tower/hero.jpg", "alt": "Render of the dark flared tower with round openings at its top, market tents and visitors on the paved platform in front", "w": 1453, "h": 835}, "gallery": [{"src": "assets/work/highway-14-tower/01.jpg", "alt": "Black-and-white aerial photograph of De Smet with the project site circled south of the town", "caption": "Aerial view of De Smet with the site circled", "w": 1453, "h": 1034, "kind": "draw"}, {"src": "assets/work/highway-14-tower/02.jpg", "alt": "Close-up aerial with the tower and its platform drawn on the site inside a white circle", "caption": "Roof-level plan on the site aerial", "w": 747, "h": 677, "kind": "draw"}, {"src": "assets/work/highway-14-tower/03.jpg", "alt": "Render of a wooden terrace under the speckled dark shell, with people doing yoga and a view of the lake", "caption": "Terrace inside the fiber-optic concrete shell", "w": 1393, "h": 849, "kind": "land"}, {"src": "assets/work/highway-14-tower/04.jpg", "alt": "Render of the tower seen across a grassy landscape with people sitting and walking", "caption": "Tower from the preserved landscape", "w": 1199, "h": 672, "kind": "land"}, {"src": "assets/work/highway-14-tower/05.jpg", "alt": "Line axonometric showing the ground floor and levels 1 to 6 separated vertically, with the spiral ramp", "caption": "Exploded axonometric, ground floor to level 6", "w": 890, "h": 1972, "kind": "port"}, {"src": "assets/work/highway-14-tower/06.jpg", "alt": "Interior render of curved ramps circling a large hydropower wheel", "caption": "Ramp and hydropower generator in the central void", "w": 1393, "h": 763, "kind": "land"}, {"src": "assets/work/highway-14-tower/07.jpg", "alt": "Sectional drawing of the flared shell with the spiral ramp, the generators and people at each level", "caption": "Section through the ramp and central void", "w": 1800, "h": 654, "kind": "draw"}, {"src": "assets/work/highway-14-tower/08.jpg", "alt": "Render of children playing in shallow water beneath a large generator wheel", "caption": "Play area under the hydropower generator", "w": 453, "h": 693, "kind": "port"}], "links": [{"src": "Bustler", "label": "The Legendary Highway 14 Tower, competition by Buildner", "date": "2023", "url": "https://bustler.net/competitions/9139/the-legendary-highway-14-tower"}, {"src": "The Plainsman, Huron SD", "label": "Public invited to vote for their favorite De Smet Highway 14 Trail Tower design", "date": "Feb 2024", "url": "https://plainsman.com/2024/02/14/public-invited-to-vote-for-their-favorite-de-smet-highway-14-trail-tower-design/"}], "pdf_pages": "32–37", "group": "design", "city": "De Smet"}, {"slug": "tili-wini", "title": "Tili Wini Terroir Vineyard", "kind": "Competition", "programme": "Winery guest homes, adaptive reuse", "location": "Perugia, Italy", "year": "2022", "season": "Summer 2022", "supervisor": "Prof. Glenn Nowak", "role": "Adaptive reuse, passive strategies", "summary": "Adaptive reuse of a stone winery building in Perugia, with two lighter, glazed additions that stand for Tili’s red, white and sparkling wines.", "body": ["In the Tili Wine guest homes in Perugia, an integration of indoor and outdoor spaces turns an old building into a new palette for viticultural experiences. Adding two lighter, more transparent masses to the original stone structure is the architectural equivalent of adding varietals to the list of guest accommodations. Inspired by the company’s products, the three main sections pay homage to Tili’s red, white and sparkling wines, and the route through them takes visitors through the surrounding landscape and its microclimates.", "The red-wine section is the adaptive reuse: just as winemakers respect the terroir of the vineyard, the design respects the history of the place, reinforcing the passive strategies inherent in the stone and the materials drawn from the surrounding earth. The white-wine section translates the proportions and rhythm of the masonry into panes of glass, and its transparent façade and operable systems open views to the vineyards. The third section, sprinkled with colored and fritted glass, amplifies the sparkling wines and improves building performance through sun control, thermal mass and natural ventilation.", "With a refreshed façade, the open gallery-style tasting area gives the building a new sense of community, and multi-use spaces blend indoor, outdoor and semi-enclosed areas. The courtyard is a communal showcase for vineyard heritage and special events, home to active and decommissioned machinery beside the bocce court and the pool, while the library shares the science of winemaking and frames views of the Green Valley Mountains."], "facts": [["Existing building", "Stone structure, adapted"], ["Additions", "Two lighter, more transparent masses"], ["Site programme", "Private outdoor area, bocce ball court, multi-use space, lap pool, entrance path"], ["Passive strategies", "Thermal mass, sun control, natural ventilation, operable glazing"]], "hero": {"src": "assets/work/tili-wini/hero.jpg", "alt": "Aerial render of the old stone winery building with its glazed additions, a long pool and trees around the courtyard", "w": 1434, "h": 840}, "gallery": [{"src": "assets/work/tili-wini/01.jpg", "alt": "Interior render of the open tasting area with tables, shelving and a tractor visible through the glazed wall", "caption": "Gallery-style tasting area", "w": 1434, "h": 647, "kind": "land"}, {"src": "assets/work/tili-wini/02.jpg", "alt": "Two line floor plans of the building on its site, rotated at an angle", "caption": "Second-floor and ground-floor plans", "w": 1277, "h": 516, "kind": "draw"}, {"src": "assets/work/tili-wini/03.jpg", "alt": "Render looking over the courtyard pool and an old truck towards the building and mountains", "caption": "Courtyard with pool and machinery", "w": 1454, "h": 814, "kind": "land"}, {"src": "assets/work/tili-wini/04.jpg", "alt": "Render of a lawn with umbrellas and a bocce court next to the rough stone wall", "caption": "Garden and bocce court beside the stone building", "w": 1455, "h": 1006, "kind": "land"}, {"src": "assets/work/tili-wini/05.jpg", "alt": "Render of a double-height interior with stairs, a gallery and a coloured glass roof", "caption": "Interior of the added mass", "w": 1453, "h": 732, "kind": "land"}, {"src": "assets/work/tili-wini/06.jpg", "alt": "Render of the courtyard between the stone wall and the slatted façade, with umbrellas and a red tractor", "caption": "Courtyard with pool and tractor", "w": 1454, "h": 669, "kind": "land"}, {"src": "assets/work/tili-wini/07.jpg", "alt": "Render of a terrace with loungers and umbrellas beside the screened glass façade", "caption": "Terrace along the screened façade", "w": 1453, "h": 669, "kind": "land"}], "links": [{"src": "World Architecture", "label": "Tili Wine Italy Guest Homes, competition by Buildner", "date": "Jun 2022", "url": "https://worldarchitecture.org/architecture-news/enhpe/tili-wine-italy-guest-homes-competition.html"}], "pdf_pages": "38–43", "group": "design", "city": "Perugia"}, {"slug": "pajouhesh", "title": "Pajouhesh High Rise", "kind": "Thesis", "programme": "Commercial high-rise", "location": "Pajouhesh Blvd, Chitgar, Tehran, Iran", "year": "2019", "season": "Summer 2019", "institution": "Pars University, Tehran", "supervisor": "Dr. Matin Alaghmandan", "role": "Evacuation researcher, design and visualization", "summary": "A high-rise in Chitgar, Tehran, with 66 floors above the ground floor, shifting blocks that create multi-story gardens at height, and an 8 m glazed ground level.", "body": ["High-rise buildings are built in abundance to make the most of land use and investment return. Their success depends on choosing the right structural system, optimizing space requirements, and designing for earthquakes and wind loads, and the complexity of modern towers makes the initial design, and the choice of the most economic frame, more important and more difficult.", "The site is in the Chitgar area of Tehran, 24,300 m² in area, and the tower has 66 floors above the ground floor. The main strategy was a vibrant, interactive building with its own neighborhood, so the first level has an 8 m high glazed façade to engage with the surroundings.", "Following Louis Sullivan’s “form follows function,” the design answers to its environmental impacts, and the cubes of the tower’s form shift to create multi-story gardens at height.", "The thesis behind the project studied the design of a commercial high-rise with regard to exit components such as elevators and refuge floors, through computational modeling."], "facts": [["Site area", "24,300 m²"], ["Floors", "66 above the ground floor"], ["Ground level", "8 m high glazed façade"], ["Thesis topic", "Designing a commercial high-rise building with regard to exit components such as elevators and refuge floors, through computational modeling"]], "hero": {"src": "assets/work/pajouhesh/hero.jpg", "alt": "Render of the glass tower at dusk with planted terraces where its blocks shift", "w": 1654, "h": 1240}, "gallery": [{"src": "assets/work/pajouhesh/01.jpg", "alt": "Circular axonometric of the city block with the site outlined, and a legend for commercial, residential and hospital neighbours", "caption": "Site context and neighbouring uses", "w": 1368, "h": 855, "kind": "draw"}, {"src": "assets/work/pajouhesh/02.jpg", "alt": "Two grey axonometrics: the tower among its neighbours, and a cut view of the tower with planted terraces", "caption": "Axonometric views of the tower and its garden terraces", "w": 1366, "h": 995, "kind": "draw"}, {"src": "assets/work/pajouhesh/03.jpg", "alt": "Two square floor plans with a central core, furniture and perimeter columns", "caption": "Seventh-level and ground-floor plans", "w": 1375, "h": 526, "kind": "draw"}, {"src": "assets/work/pajouhesh/04.jpg", "alt": "Full-height render of the tower at dusk with planted terraces and trees at its base", "caption": "Exterior render", "w": 1300, "h": 1838, "kind": "port"}, {"src": "assets/work/pajouhesh/05.jpg", "alt": "Night render of the glazed ground floor with a long reflecting pool leading to the entrance", "caption": "Entrance plaza and reflecting pool", "w": 1150, "h": 1457, "kind": "port"}, {"src": "assets/work/pajouhesh/06.jpg", "alt": "Render of a planted terrace behind a railing, looking into an office floor", "caption": "Terraces", "w": 1147, "h": 582, "kind": "land"}], "links": [], "pdf_pages": "44–49", "group": "design", "city": "Tehran"}, {"slug": "diagonal", "title": "Diagonal High Rise", "kind": "Academic", "programme": "Office tower", "location": "Dadman Blvd, Tehran, Iran", "year": "2017", "season": "Winter 2017", "supervisor": "Dr. Matin Alaghmandan and Prof. Mahmoud Golabchi", "role": "Design and visualization", "collaborators": "Hastee Keea", "summary": "An office tower on Dadman Boulevard, Tehran, with 66 floors above the ground floor and a diagrid exoskeleton that frees the floors of columns.", "body": ["High-rise design with diagrid structures is common today; many prominent towers use the technique, which contributes to their shape. The project sits on Dadman Boulevard, one of the walkable streets in the west of Tehran, with 66 floors above the ground floor, and is meant to be a monumental urban object, recognizable from different parts of the street.", "A diagrid is a framework of beams that intersect in a diagonal pattern. It needs less steel than an ordinary steel frame and removes the need for columns. Here it creates column-free work areas, and the spans between its nodes give the offices open views. The exoskeleton redirects high lateral loads away from the ends of the building, which makes it possible to place open atriums at its narrow ends.", "A sky lobby divides the programme in two, with rental office floors below and office floors above. The central cross-type core reduces public circulation areas, moves sanitary functions into the unused elevator-group lobbies and keeps the core compact."], "facts": [["Floors", "66 above the ground floor"], ["Structure", "Diagrid exoskeleton"], ["Core", "Central cross-type core"], ["Programme, bottom to top", "Automated parking, parking, mechanical, commercial, office type A, sky lobby, office type B, mechanical and sky center, office type C, sky deck"]], "hero": {"src": "assets/work/diagonal/hero.jpg", "alt": "Render of the upper part of the tower, its stacked diagrid volumes twisting against a blue sky", "w": 1654, "h": 1240}, "gallery": [{"src": "assets/work/diagonal/01.jpg", "alt": "Grey massing site plan with the tower site at a road junction, roads drawn in red", "caption": "Site plan, Dadman Boulevard", "w": 1405, "h": 889, "kind": "draw"}, {"src": "assets/work/diagonal/02.jpg", "alt": "Colour-coded diagram of the tower’s floors inside the diagrid, labelled from automated parking to sky deck", "caption": "Programme stack", "w": 710, "h": 1156, "kind": "port"}, {"src": "assets/work/diagonal/03.jpg", "alt": "Close-up render of the white diagrid members and glazing", "caption": "Diagrid façade detail", "w": 839, "h": 2338, "kind": "port"}, {"src": "assets/work/diagonal/04.jpg", "alt": "Full-height render of the twisting diagrid tower above trees and low buildings", "caption": "Exterior render", "w": 1300, "h": 1838, "kind": "port"}, {"src": "assets/work/diagonal/05.jpg", "alt": "Two floor plans: an office level with a cross-shaped core, and a parking level with a ramp", "caption": "Third-level and parking floor plans", "w": 1358, "h": 586, "kind": "draw"}, {"src": "assets/work/diagonal/06.jpg", "alt": "Line details of a diagrid node and a floor connection, labelled with steel profiles, truss and concrete layers", "caption": "Diagrid connection details", "w": 1278, "h": 644, "kind": "draw"}], "links": [], "pdf_pages": "50–55", "group": "design", "city": "Tehran"}, {"slug": "farvehar", "title": "Farvehar Hospital", "kind": "Academic", "programme": "Hospital", "location": "Hormozan Blvd, Tehran, Iran", "year": "2013", "season": "Winter 2013", "supervisor": "Shahram Zarkesh", "role": "Concept, visualization", "summary": "A cross-shaped hospital on Hormozan Boulevard, Tehran, whose triangle-patterned façade draws on the Farvahar’s motto of good thoughts, good words and good deeds.", "body": ["The circulation of medical buildings is often a set of stiff passageways. The interior design of Farvehar Hospital turns those passageways into varied service spaces full of activity.", "The site is on Hormozan Boulevard, one of the most important streets in the Khordin area. Under Mohammad Reza Shah Pahlavi, American specialists and industrialists who came to expand scientific and industrial activity settled in the West Town Residential Complex, and foreign construction companies laid out new plans around the historic village of Khordin. Its villas and quiet side streets are well known to Tehranians.", "Christianity, Islam and Zoroastrianism share a belief in one God, and people of all three faiths go to holy places such as mosques and churches to pray for relief from pain and for their health.", "The façade uses a triangle texture as a sign of the Farvahar’s motto, good thoughts, good words and good deeds. Openings are cut into it, a holy place is formed inside the hospital, terraces are added, and the levels are rotated so that the building reads as a bird in flight."], "facts": [["Plan", "Cross-shaped"], ["Façade", "Triangle pattern derived from the Farvahar symbol"]], "hero": {"src": "assets/work/farvehar/hero.jpg", "alt": "Render of the long, low hospital with a perforated façade and a raised cross-shaped screen, seen from the approach road", "w": 1446, "h": 799}, "gallery": [{"src": "assets/work/farvehar/01.jpg", "alt": "Rendered site plan of the cross-shaped hospital in a planted block, with roads around it", "caption": "Site plan", "w": 1438, "h": 904, "kind": "draw"}, {"src": "assets/work/farvehar/02.jpg", "alt": "Two cross-shaped floor plans with wards, treatment rooms and a central hall", "caption": "Second-floor and ground-floor plans", "w": 1446, "h": 605, "kind": "draw"}, {"src": "assets/work/farvehar/03.jpg", "alt": "Sequence of drawings simplifying the Farvahar symbol into a triangle", "caption": "Façade pattern derived from the Farvahar symbol", "w": 1454, "h": 346, "kind": "draw"}, {"src": "assets/work/farvehar/04.jpg", "alt": "Cross-shaped perforated panel and two strips of triangular pattern", "caption": "Façade panel and pattern details", "w": 1439, "h": 563, "kind": "draw"}, {"src": "assets/work/farvehar/05.jpg", "alt": "Rendered elevation of the full façade with rows of small openings", "caption": "Façade elevation", "w": 1454, "h": 295, "kind": "draw"}, {"src": "assets/work/farvehar/06.jpg", "alt": "Render of the entrance steps beneath the cross-shaped screen", "caption": "Entrance", "w": 1157, "h": 672, "kind": "land"}, {"src": "assets/work/farvehar/07.jpg", "alt": "Render of the façade with triangular openings and the perforated cross", "caption": "Façade with cross-shaped screen", "w": 1156, "h": 651, "kind": "land"}, {"src": "assets/work/farvehar/08.jpg", "alt": "Render of a patient room lit through triangular openings in the wall", "caption": "Patient room with triangular openings", "w": 1155, "h": 657, "kind": "land"}], "links": [], "pdf_pages": "56–61", "group": "design", "city": "Tehran"}, {"slug": "intelligence-shadier", "title": "Intelligence Shadier", "kind": "Academic", "programme": "Responsive shading prototype", "location": "Tehran, Iran", "year": "2019", "season": "Summer 2019", "supervisor": "Mrs. Ensafi", "summary": "An umbrella-like shading form, made in wood and driven by Rhino, Grasshopper and Arduino, that reacts to light as part of an imagined smart building.", "body": ["As science and technology improve every day, the way we live needs to change too. Every year, natural disasters and terrorist attacks kill many people around the world. We believe that with new technologies there will be a time when our homes and offices are intelligent, convenient to live in, and able to protect us from such events.", "As intelligent programs find their way into our houses and little by little manage them for us, the project imagines something intelligent for a smart building that could save energy and time: a shader.", "It starts from the umbrella, which shelters a large area from a small base. We made a solid form of it in wood, and used McNeel Rhino, Grasshopper and Arduino for the program and the parameters it reacts to. Connected to the Arduino, the umbrella becomes a shader that could respond to anything; in this example it was sensitive to light."], "facts": [["Tools", "McNeel Rhino, Grasshopper, Arduino"], ["Material", "Wood"], ["Responds to", "Light, in this example"]], "hero": {"src": "assets/work/intelligence-shadier/hero.jpg", "alt": "Black-and-white collage of the shading structure, a lattice sphere on a woven stem, rising over a misty city with drones", "w": 1598, "h": 1248}, "gallery": [{"src": "assets/work/intelligence-shadier/01.jpg", "alt": "Pencil-style sketches of globes and world maps", "caption": "World maps and globes", "w": 1341, "h": 599, "kind": "draw"}, {"src": "assets/work/intelligence-shadier/02.jpg", "alt": "Row of simple building icons with arrows, ending in a building under a dome", "caption": "Concept sequence", "w": 1433, "h": 277, "kind": "draw"}, {"src": "assets/work/intelligence-shadier/03.jpg", "alt": "Black-and-white render of the lattice sphere on a tall woven stem above rocky ground, with drones", "caption": "Shading structure in a landscape", "w": 1300, "h": 1857, "kind": "port"}, {"src": "assets/work/intelligence-shadier/04.jpg", "alt": "Line and tone diagrams of a mechanism, a dome on a base, and buildings with a dome on top", "caption": "Diagrams of the shading unit", "w": 1450, "h": 561, "kind": "draw"}], "links": [], "pdf_pages": "62–65", "group": "design", "city": "Tehran"}, {"slug": "movable-high-rise", "title": "Movable High-Rise Building", "kind": "Academic", "group": "archive", "programme": "Kinetic architecture", "location": "Tehran, Iran", "city": "Tehran", "year": "2016", "summary": "An earlier study in kinetic architecture, shown here as pages from the printed portfolio.", "body": [], "facts": [], "hero": {"src": "assets/portfolio/page_45.jpg", "alt": "Movable High-Rise Building, portfolio page", "w": null, "h": null}, "thumb": "assets/portfolio/page_45.jpg", "gallery": [], "spreads": [[45], [46], [47, 48]], "season": "2016"}, {"slug": "roof-yard-house", "title": "Roof Yard House", "kind": "Academic", "group": "archive", "programme": "Residential tower", "location": "Tehran, Iran", "city": "Tehran", "year": "2016", "summary": "An earlier residential tower project, shown here as pages from the printed portfolio.", "body": [], "facts": [], "hero": {"src": "assets/portfolio/page_49.jpg", "alt": "Roof Yard House, portfolio page", "w": null, "h": null}, "thumb": "assets/portfolio/page_49.jpg", "gallery": [], "spreads": [[49, 50], [51, 52], [53, 54], [55, 57]], "season": "2016"}], "teaching": {"intro": "Alongside practice, I teach and mentor design students at UNLV's School of Architecture, guiding projects from first concept through final review. For most of these students this is their first second-year studio, and the first building they have designed from start to finish.", "items": [{"n": "Misty Grove", "by": "Erys Whitmore", "tags": "Biophilic design, hand model", "img": "assets/teaching/erys-whitmore_misty-grove.jpg", "pdf": "assets/teaching/pdf/erys-whitmore_misty-grove.pdf", "alt": "Misty Grove, monochromatic site model by Erys Whitmore", "d": "Erys set her event-and-stay retreat on Vashon Island, Washington, and let biophilic design drive every move: six cabins gathered around a café, a productive public garden, and a wellness-focused event center, all held back from a protected wildlife corridor. Her monochromatic study model, staged in dried botanicals, carries that nature-first concept through the presentation."}, {"n": "The Yucca", "by": "Dann Carlo Ramos", "tags": "Cultural, climate-responsive", "board": true, "img": "assets/teaching/dann-ramos_the-yucca.jpg", "pdf": "assets/teaching/pdf/dann-ramos_the-yucca.pdf", "alt": "The Yucca, presentation board by Dann Carlo Ramos", "d": "Dann's arts-and-culture center in Albuquerque is organized as a climate-responsive landscape, its form borrowed from the yucca: “as it goes up, it goes outward.” Earth-sheltered volumes, a rattan shading canopy, and terracotta thermal-mass walls wrap a semi-sunken amphitheater."}, {"n": "Hand-Grown Sanctuary", "by": "Victoria Jungic", "tags": "Wildlife, watercolor", "img": "assets/teaching/victoria-jungic_hand-grown-sanctuary.jpg", "pdf": "assets/teaching/pdf/victoria-jungic_hand-grown-sanctuary.pdf", "alt": "Hand-Grown Sanctuary bird blind, watercolor by Victoria Jungic", "d": "Victoria framed the whole center around one idea, a sanctuary that is “cultivated, not constructed.” From a full site-zoning study she developed a family of bird blinds (central, children's, riverside and stream) with one-way viewing film, integrated perches and guano collection, worked out in watercolor elevations and cardboard study models."}, {"n": "Flowform", "by": "Jacob Miranda", "tags": "Kinetic façade, rendering", "img": "assets/teaching/jacob-miranda_flowform.jpg", "pdf": "assets/teaching/pdf/jacob-miranda_flowform.pdf", "alt": "Flowform kinetic workshop, render by Jacob Miranda", "d": "Jacob's kinetic education workshop runs on its own water wheel: water turns the wheel, the shaft drives a generator, and wiring carries power onto the site. A kinetic aluminum façade reads as “birds in flight,” Shou Sugi Ban charred-cedar walls push the building's lifespan past fifty years, and bird-safe glazing protects the wildlife it teaches about."}, {"n": "Signage Improvements", "by": "Evan Phillips", "tags": "Wayfinding, signage system", "board": true, "img": "assets/teaching/evan-phillips_signage.jpg", "pdf": "assets/teaching/pdf/evan-phillips_signage.pdf", "alt": "Signage Improvements, entry gateway elevation by Evan Phillips", "d": "Evan saw the center's mismatched signage as an opportunity and built a modular system to fix it, inspired by Cormie, WCNC's ambassador cormorant. A timber-and-aluminum entry gateway, info panels, wayfinding posts and an ambassador-animal series are worked out to section cuts, exploded axons, materials and a per-sign budget, then composited onto real site photos."}, {"n": "Fledgling Future: Trails", "by": "Esmeralda Gonzalez", "tags": "Landscape, trails", "img": "assets/teaching/esmeralda-gonzalez_trails.jpg", "pdf": "assets/teaching/pdf/esmeralda-gonzalez_trails.pdf", "alt": "Fledgling Future Trails, outdoor convo-pit by Esmeralda Gonzalez", "d": "Esmeralda designed the master plan's connective tissue, a trail network stitched together with seating, restrooms and gathering spaces. Reading how social seabirds flock, she shaped places for people to do the same: a kidney-plan event space i     '<section class="sec tight"><div class="shead"><h2 class="h3">Experimental work</h2><p class="mute" style="max-width:52ch;font-size:15px">Where I step away from the drawing set: short films and motion studies about how a building moves and catches light.</p></div><div class="vids">'+
      R.videos.map(function(v){return '<div class="rv"><video controls playsinline preload="metadata"><source src="'+v.src+'" type="video/mp4"></video><p class="kick" style="margin-top:14px">'+esc(v.label)+'</p><h3 class="h3" style="margin-top:4px">'+esc(v.title)+'</h3>'+(v.d?'<p>'+esc(v.d)+'</p>':'')+'</div>';}).join('')+
    '</div></section></div>';
}

function vAbout(){

  function sec(t,inner,id){return '<section class="sec tight"'+(id?' id="'+id+'"':'')+'><div class="g12"><div class="c-l"><h2 class="h3">'+t+'</h2></div><div class="c-r">'+inner+'</div></div></section>';}

    '<div class="c-r7" style="padding-top:12px"><div class="prose" style="font-size:18px;line-height:1.6">'+A.bio.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div></div></header>'+
    '<div style="border-top:1px solid var(--line)"></div>'+

    sec('Software','<dl class="tools">'+A.tools.map(function(t){return '<div><dt>'+esc(t[0])+'</dt><dd>'+esc(t[1])+'</dd></div>';}).join('')+'</dl>')+
    sec('References','<div class="rows">'+A.refs.map(function(r){return '<div><span class="a">'+esc(r.o)+'</span><span class="b"><strong>'+esc(r.n)+'</strong><span>'+esc(r.r)+'</span><p>'+esc(r.q)+'</p></span><span class="c">'+(r.e?'<a class="lnk" href="mailto:'+esc(r.e)+'">'+esc(r.e)+'</a>':'Contact details on request')+'</span></div>';}).join('')+'</div>')+
    '</div>';

function vContact(){
  return '<div class="wrap"><header class="p-top"><h1 class="h1">Contact</h1><p class="lede wide">Open to new roles, collaborations, competitions, and conversations about architecture.</p></header>'+

    '<div class="c-r7"><p class="kick" style="margin-bottom:14px">Email</p><a class="big-l" href="mailto:'+EMAIL+'">'+EMAIL+'</a></div></div></section></div>';
}
function vMissing(){return '<div class="wrap p-top"><h1 class="h1">Not found</h1><p class="lede" style="margin-top:20px">That page does not exist. <a class="lnk" href="#/work">See all work</a>.</p></div>';}

/* ───────────── router ───────────── */
var curHash=location.hash||'#/';
function parse(){
  var h=curHash.replace(/^#\/?/,''), q={}, parts=h.split('?');
  (parts[1]||'').split('&').forEach(function(kv){if(!kv)return;var a=kv.split('=');q[a[0]]=decodeURIComponent(a[1]||'');});
  var seg=parts[0].split('/').filter(Boolean);
  return {seg:seg,q:q,key:parts[0]||'home'};
}
var TITLES={home:'Arsalan Mirsadraei — Architect',work:'Work',teaching:'Teaching',research:'Research',about:'About',contact:'Contact'};
function render(){
  var r=parse(), s=r.seg[0]||'home', html, title;
  if(s==='home')html=vHome();
  else if(s==='work'&&r.seg[1]){html=vProject(r.seg[1]);title=(byslug[r.seg[1]]||{title:'Not found'}).title;}
  else if(s==='work')html=vWork(r.q);
  else if(s==='teaching')html=vTeaching();
  else if(s==='research')html=vResearch();
  else if(s==='about')html=vAbout();
  else if(s==='contact')html=vContact();
  else{html=vMissing();title='Not found';}
  teardown();
  main.innerHTML='<div class="view">'+html+'</div>';
  main.classList.toggle('flush',s==='home');
  document.title=title?title+' — Arsalan Mirsadraei':(s==='home'?TITLES.home:(TITLES[s]||'Arsalan Mirsadraei')+' — Arsalan Mirsadraei');
  all('.nav a').forEach(function(a){var on=a.getAttribute('data-r')===s;if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  setup(s,r);
  return r;
}
function go(){
  var prevKey=curPath, r=parse(), byClick=navByClick, keep=keepScroll, y0=window.scrollY;
  navByClick=false;keepScroll=false;
  if(prevKey!=null)scrollMem[prevKey]=y0;
  closeMenu();
  var swap=function(){
    render();curPath=r.key;
    var y=keep?y0:((!byClick&&scrollMem[r.key]!=null)?scrollMem[r.key]:0);
    window.scrollTo(0,y);onScroll();
    if(prevKey!=null&&!keep){var h1=el('h1',main);if(h1){h1.setAttribute('tabindex','-1');h1.style.outline='none';h1.focus({preventScroll:true});}}
  };
  if(prevKey==null||RM.matches||keep){swap();}
  else if(document.startViewTransition){document.startViewTransition(swap);}
  else{swap();var v=el('.view',main);if(v)v.classList.add('enter');}
}
var navByClick=false, keepScroll=false;
/* Navigate in script rather than relying on the browser following #links,
   so the site also works inside preview frames and editors that block link clicks. */
function navigate(h,keep){
  if(h===curHash){return;}
  curHash=h; navByClick=!keep; keepScroll=!!keep;
  var ok=false;
  try{history.pushState(null,'',h);ok=true;}catch(_){}
  if(!ok){try{location.hash=h;}catch(_){}}
  go();
}
window.addEventListener('click',function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var a=e.target.closest&&e.target.closest('a[href^="#/"]');
  if(!a)return;
  e.preventDefault();e.stopPropagation();
  navigate(a.getAttribute('href'));
},true);
function syncFromUrl(){var h=location.hash||'#/';if(h===curHash&&curPath!=null)return;curHash=h;go();}
window.addEventListener('hashchange',syncFromUrl);
window.addEventListener('popstate',syncFromUrl);

/* ───────────── per-view behaviour ───────────── */
function teardown(){
  destroyers.forEach(function(f){try{f();}catch(_){}});destroyers=[];
  if(io){io.disconnect();io=null;}
  if(peekEl){peekEl.classList.remove('on');}
}
function setup(s,r){
  // figures
  all('figure.fig[data-fig]',main).forEach(function(f){
    var id=f.getAttribute('data-fig'), m=window.AM_FIGS&&window.AM_FIGS[id];
    if(m){try{var d=m(f,{slug:f.getAttribute('data-slug')});if(typeof d==='function')destroyers.push(d);}catch(err){console.error(id,err);}}
  });
  watchImgs(main);setTimeout(function(){watchImgs(main);},400);
  // reveal
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.06});
    var n=0;all('.rv',main).forEach(function(x){var b=x.getBoundingClientRect();if(b.top<innerHeight){x.style.transitionDelay=Math.min(n++*50,150)+'ms';}io.observe(x);});
  }else all('.rv',main).forEach(function(x){x.classList.add('in');});
  // peek
  all('.row[data-slug]',main).forEach(function(a){
    a.addEventListener('pointerenter',function(e){px=e.clientX;py=e.clientY;showPeek(byslug[a.getAttribute('data-slug')]);});
    a.addEventListener('pointerleave',hidePeek);
  });
  // hero video
  var v=el('#hv',main), b=el('#vidb',main);
  if(v){
    if(RM.matches){v.removeAttribute('autoplay');v.pause();b.textContent='Play video';b.setAttribute('aria-pressed','true');}
    b.addEventListener('click',function(){if(v.paused){v.play().catch(function(){});b.textContent='Pause video';b.setAttribute('aria-pressed','false');}else{v.pause();b.textContent='Play video';b.setAttribute('aria-pressed','true');}});
    var vio=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)v.pause();else if(b.getAttribute('aria-pressed')==='false')v.play().catch(function(){});});});
    vio.observe(v);destroyers.push(function(){vio.disconnect();});
  }
  // work filters
  all('[data-f]',main).forEach(function(c){c.addEventListener('click',function(){var q=parse().q;q.f=c.getAttribute('data-f');setQ(q);});});
  all('[data-v]',main).forEach(function(c){c.addEventListener('click',function(){var q=parse().q;q.v=c.getAttribute('data-v');setQ(q);});});
  // teaching
  all('[data-t]',main).forEach(function(c){c.addEventListener('click',function(){openPdf(+c.getAttribute('data-t'));});});
  // archive spreads
  all('[data-sp]',main).forEach(function(c){c.addEventListener('click',function(){openSpreads(byslug[r.seg[1]],+c.getAttribute('data-sp'));});});
}
function setQ(q){var s=Object.keys(q).filter(function(k){return q[k]&&!(k==='f'&&q[k]==='all')&&!(k==='v'&&q[k]==='grid');}).map(function(k){return k+'='+encodeURIComponent(q[k]);}).join('&');navigate('#/work'+(s?'?'+s:''),true);}

/* peek image that follows the pointer on index rows */
var px=0,py=0,raf=0,peekImg=null,peekCard=null,peekTok=0;
function placePeek(){if(!peekEl)return;var w=340,x=Math.min(px+24,innerWidth-w-16),y=Math.min(Math.max(py-130,72),innerHeight-280);peekEl.style.transform='translate3d('+x+'px,'+y+'px,0)';}
function showPeek(p){
  if(!p||!window.matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  if(!peekEl){
    peekEl=document.createElement('div');peekEl.className='peek';peekEl.setAttribute('aria-hidden','true');
    peekEl.innerHTML='<img alt="" data-peek-img referrerpolicy="no-referrer"><div class="peek-card"><span></span><small></small></div>';
    document.body.appendChild(peekEl);peekImg=peekEl.querySelector('img');peekCard=peekEl.querySelector('.peek-card');
  }
  var tok=++peekTok, first=p.thumb||p.hero.src, list=[first].concat(/^assets\/work\//.test(first)?[first.replace('assets/work/','assets/Work/')]:[]).concat(p.hero.fb||[]);
  peekCard.firstChild.textContent=p.title;
  peekCard.lastChild.textContent=p.group==='practice'?(p.credit||'Press image')+(p.primary?' · '+p.primary.src:''):(p.programme||'');
  function tryNext(){
    if(tok!==peekTok)return;
    var src=list.shift();
    if(!src){peekEl.classList.add('card');return;}
    var probe=new Image();probe.referrerPolicy='no-referrer';
    probe.onload=function(){if(tok!==peekTok)return;peekImg.src=src;peekEl.classList.remove('card');};
    probe.onerror=tryNext;probe.src=src;
  }
  if(peekImg.getAttribute('src')!==list[0]||peekEl.classList.contains('card')){peekEl.classList.add('card');tryNext();}
  placePeek();peekEl.classList.add('on');
}
function hidePeek(){peekTok++;if(peekEl)peekEl.classList.remove('on');}
document.addEventListener('pointermove',function(e){px=e.clientX;py=e.clientY;if(peekEl&&peekEl.classList.contains('on')&&!raf)raf=requestAnimationFrame(function(){raf=0;placePeek();});},{passive:true});

/* header state */
function onScroll(){
  var hero=el('.hero',main), y=window.scrollY;
  hdr.classList.toggle('over',!!hero&&y<hero.offsetHeight-60&&!menuOpen);
  hdr.classList.toggle('ruled',y>8);
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll,{passive:true});

/* menu (small screens) */
var menuOpen=false, nav=el('#nav'), mb=el('#menub');
function closeMenu(){menuOpen=false;nav.classList.remove('open');mb.setAttribute('aria-expanded','false');mb.textContent='Menu';onScroll();}
mb.addEventListener('click',function(){menuOpen=!menuOpen;nav.classList.toggle('open',menuOpen);mb.setAttribute('aria-expanded',String(menuOpen));mb.textContent=menuOpen?'Close':'Menu';onScroll();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menuOpen)closeMenu();});

/* theme */
el('#tog').addEventListener('click',function(){
  var h=document.documentElement, dark=h.getAttribute('data-theme')!=='dark';
  h.classList.add('theme-swap'); h.setAttribute('data-theme',dark?'dark':'light');
  try{localStorage.setItem('am-theme',dark?'dark':'light');}catch(_){}
  requestAnimationFrame(function(){requestAnimationFrame(function(){h.classList.remove('theme-swap');});});
});

/* ───────────── lightbox ───────────── */
var lb=el('#lb'), lbStage=el('#lb-stage'), lbTtl=el('#lb-ttl'), lbFoot=el('#lb-foot'), lbOpen=el('#lb-open'), lbState=null, lastFocus=null;
function openLb(){lastFocus=document.activeElement;if(!lb.open){lb.showModal();}document.documentElement.style.overflow='hidden';}
function closeLb(){if(lb.open)lb.close();}
lb.addEventListener('close',function(){document.documentElement.style.overflow='';lbStage.innerHTML='';pdfToken++;lbState=null;if(lastFocus&&lastFocus.focus)lastFocus.focus();});
el('#lb-x').addEventListener('click',closeLb);
el('#lb-prev').addEventListener('click',function(){step(-1);});
el('#lb-next').addEventListener('click',function(){step(1);});
lb.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}else if(e.key==='ArrowRight'){step(1);e.preventDefault();}});
function step(d){if(!lbState)return;var n=lbState.list.length;lbState.i=(lbState.i+d+n)%n;lbState.draw();}

function openSpreads(p,i){
  lbState={list:p.spreads,i:i,draw:function(){
    var s=this.list[this.i];
    lbStage.className='lb-stage fit';
    lbStage.innerHTML='<div class="pair'+(s.length===1?' one':'')+'">'+s.map(function(n){return '<img src="'+pg(n)+'" alt="Portfolio page '+n+'">';}).join('')+'</div>';
    lbTtl.innerHTML=esc(p.title)+'<span>'+(this.i+1)+' / '+this.list.length+'</span>';
    lbFoot.textContent='Pages '+s.join(' and ')+' of the printed portfolio. Arrow keys to move, Esc to close.';
    lbOpen.hidden=true;
  }};
  lbState.draw();openLb();
}
var pdfToken=0, pdfjsP=null;
function loadPdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};s.onerror=rej;document.head.appendChild(s);});
  return pdfjsP;
}
function openPdf(i){
  var T=D.teaching.items;
  lbState={list:T,i:i,draw:function(){
    var t=this.list[this.i], tok=++pdfToken;
    lbStage.className='lb-stage';lbStage.innerHTML='<p class="lb-load">Loading the full project set…</p>';lbStage.scrollTop=0;
    lbTtl.innerHTML=esc(t.n)+'<span>'+esc(t.by)+'</span>';
    lbFoot.textContent=t.d; lbOpen.hidden=false; lbOpen.href=t.pdf;
    loadPdfjs().then(function(lib){return lib.getDocument(t.pdf).promise;}).then(function(pdf){
      if(tok!==pdfToken)return;
      var dpr=Math.min(window.devicePixelRatio||1,1.5), tw=Math.min(lbStage.clientWidth-48,1100), shown=0, p=1;
      var loader=el('.lb-load',lbStage);
      function next(){
        if(tok!==pdfToken||p>pdf.numPages){if(!shown&&loader)loader.innerHTML='Preview unavailable here. Use “Open PDF”.';return;}
        if(loader)loader.textContent='Rendering page '+p+' of '+pdf.numPages+'…';
        pdf.getPage(p++).then(function(pg){
          var b=pg.getViewport({scale:1}), sc=tw/b.width*dpr, L=Math.max(b.width,b.height)*sc; if(L>2600)sc*=2600/L;
          var vp=pg.getViewport({scale:sc}), c=document.createElement('canvas'); c.width=Math.round(vp.width);c.height=Math.round(vp.height);c.style.width=(vp.width/dpr)+'px';
          return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){if(tok!==pdfToken)return;if(loader&&loader.parentNode){loader.remove();loader=null;}lbStage.appendChild(c);shown++;});
        }).catch(function(){}).then(next);
      }
      next();
    }).catch(function(){if(tok===pdfToken)lbStage.innerHTML='<p class="lb-load">Preview unavailable here. Use “Open PDF”.</p>';});
  }};
  lbState.draw();openLb();
}

/* external images that cannot load become a quiet typographic panel */
function onImgErr(e){
  var t=e&&e.target?e.target:e; if(!t||t.tagName!=='IMG'||t.hasAttribute('data-peek-img'))return;
  var s0=t.getAttribute('src')||'';
  if(/(^|\/)assets\/work\//.test(s0)&&!t.hasAttribute('data-case')){t.setAttribute('data-case','1');t.src=s0.replace('assets/work/','assets/Work/');return;}
  var fb=t.getAttribute('data-fb');
  if(fb){var list=fb.split('|');var next=list.shift();if(list.length)t.setAttribute('data-fb',list.join('|'));else t.removeAttribute('data-fb');t.src=next;return;}
  if(!/^https?:/.test(t.getAttribute('src')||''))return;
  var d=document.createElement('div'); d.className='ph'; d.setAttribute('role','img'); d.setAttribute('aria-label',t.alt||'');
  d.innerHTML='<span>'+esc(t.getAttribute('data-ph')||t.alt||'')+'</span><small>Press image</small>';
  t.replaceWith(d);
}
document.addEventListener('error',onImgErr,true);
function watchImgs(root){all('img',root).forEach(function(im){if(im.__w)return;im.__w=1;im.addEventListener('error',onImgErr);if(im.complete&&im.naturalWidth===0&&im.getAttribute('src'))onImgErr(im);});}

/* footer email */
all('[data-email]').forEach(function(a){a.href='mailto:'+EMAIL;a.textContent=EMAIL;});

go();
})();

</script>
